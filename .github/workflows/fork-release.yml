# A fork's release (docs/mesh.md#release-channel): push a tag
# `v<version>` matching crates/herdr-core/Cargo.toml, e.g. v0.1.21-mesh.1.
# Five builds as upstream makes them (Linux static musl x86_64/aarch64, macOS
# x86_64/aarch64, Windows x86_64), published with no secrets at all:
#
# - the archives and manifest.json go to this repository's GitHub release;
# - core/<version>/manifest.json, then core/latest.json and the install
#   scripts, go to the `channel` branch, which is the release channel hc
#   reads: https://raw.githubusercontent.com/<owner>/<repo>/channel, or the
#   repository variable RELEASES_URL (e.g. GitHub Pages serving that branch).
#
# The builds are made with that channel (HC_RELEASES_URL), so they update
# from this fork, not upstream. macOS builds are ad-hoc signed unless the
# APPLE_CERTIFICATE_P12/APPLE_CERTIFICATE_PASSWORD secrets are set, and
# notarized only when APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER are.
# Upstream's own release.yml skips itself on forks.
name: fork-release

on:
  push:
    tags: ["v*-mesh.*"]
  # Builds only; publishing needs a tag.
  workflow_dispatch:

permissions:
  contents: read

# Never cancel: a cancelled tag run is a half release.
concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.95.0
  IS_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
  HC_RELEASES_URL: ${{ vars.RELEASES_URL || format('https://raw.githubusercontent.com/{0}/channel', github.repository) }}

jobs:
  build:
    if: github.repository != 'herdrdev/herdr-core'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { name: linux-aarch64, target: aarch64-unknown-linux-musl, runner: ubuntu-22.04-arm }
          - { name: macos-aarch64, target: aarch64-apple-darwin, runner: macos-15 }
          # Cross-build on Apple Silicon; verify the Intel binary under Rosetta.
          - { name: macos-x86_64, target: x86_64-apple-darwin, runner: macos-15 }
          - { name: windows-x86_64, target: x86_64-pc-windows-msvc, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}-fork-release
          cache-workspace-crates: true
          cache-bin: false
          save-if: false
      - name: Version matches the tag
        if: env.IS_TAG == 'true'
        run: |
          want="v$(sed -n 's/^version = "\(.*\)"/\1/p' crates/herdr-core/Cargo.toml | head -1)"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $want"; exit 1; }
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p herdr-core
      - name: Assemble macOS bundle
        if: runner.os == 'macOS'
        run: sh scripts/mac-bundle target/${{ matrix.target }}/release/herdr-core 'target/${{ matrix.target }}/release/Herdr Core.app'
      # Ad-hoc without the certificate secrets; manual runs never get them.
      - name: Sign macOS bundle and standalone executable
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE_P12: ${{ github.event_name == 'push' && secrets.APPLE_CERTIFICATE_P12 || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
        run: |
          scripts/mac-sign 'target/${{ matrix.target }}/release/Herdr Core.app'
          scripts/mac-sign 'target/${{ matrix.target }}/release/herdr-core'
      - name: Notarize macOS bundle and standalone executable
        if: runner.os == 'macOS' && env.IS_TAG == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ] || [ -z "$APPLE_API_KEY" ]; then echo "no Apple secrets: ad-hoc, not notarized"; exit 0; fi
          bash scripts/mac-notarize 'target/${{ matrix.target }}/release/Herdr Core.app'
          bash scripts/mac-notarize 'target/${{ matrix.target }}/release/herdr-core'
      - name: Pack
        if: runner.os != 'Windows'
        run: |
          bin=target/${{ matrix.target }}/release/herdr-core
          "$bin" --version # it runs on its own platform
          if [ "${{ runner.os }}" = Linux ]; then file "$bin" | grep -q 'static' || { file "$bin"; echo "not static"; exit 1; }; fi
          mkdir -p dist
          if [ "${{ runner.os }}" = macOS ]; then bin="$(dirname "$bin")/Herdr Core.app"; fi
          sh scripts/package "$bin" dist/herdr-core-${{ matrix.name }}.tar.gz
      # Unsigned: Windows may warn before running it.
      - name: Pack (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/herdr-core.exe"
          & $bin --version
          if ($LASTEXITCODE) { throw "it does not run" }
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($bin)).ToLower()
          foreach ($dll in "vcruntime140", "msvcp140", "api-ms-win-crt-") { if ($text.Contains($dll)) { throw "herdr-core.exe imports $dll" } }
          New-Item -ItemType Directory -Force stage/THIRD-PARTY-NOTICES, dist | Out-Null
          Copy-Item $bin stage/
          Copy-Item LICENSE stage/
          Copy-Item crates/herdr-core/THIRD-PARTY-NOTICES stage/THIRD-PARTY-NOTICES/herdr-core.txt
          scripts/fetch-conpty.ps1 -Dest stage
          Copy-Item distribution/windows/* stage/THIRD-PARTY-NOTICES/
          tar -a -cf dist/herdr-core-${{ matrix.name }}.zip -C stage herdr-core.exe conpty LICENSE THIRD-PARTY-NOTICES
          if ($LASTEXITCODE) { throw "zip failed" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: herdr-core-${{ matrix.name }}
          path: dist/herdr-core-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.repository != 'herdrdev/herdr-core' && github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Manifest
        run: |
          version=${GITHUB_REF_NAME#v}
          export NOTES="$(awk -v heading="## [$version] - " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found && /^- / { sub(/^- /, ""); print; exit }' CHANGELOG.md)"
          export RELEASES_URL=$HC_RELEASES_URL
          export ASSETS_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          scripts/manifest dist > dist/manifest.json && cat dist/manifest.json
      # The archives first, so no manifest names a file that isn't up yet.
      - name: GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/herdr-core-*.tar.gz dist/herdr-core-*.zip dist/manifest.json \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Install: curl -fsSL $HC_RELEASES_URL/core/install.sh | sh"
      # The installers default to this channel; latest.json moves only forward,
      # so re-running an old tag cannot roll everyone back.
      - name: Channel
        run: |
          version=${GITHUB_REF_NAME#v}
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git fetch --depth 1 origin channel; then git worktree add -B channel ../channel FETCH_HEAD
          else git worktree add --orphan -b channel ../channel; fi
          mkdir -p "../channel/core/$version"
          cp dist/manifest.json "../channel/core/$version/manifest.json"
          latest=$(sed -n 's/^  "version": "\(.*\)",$/\1/p' ../channel/core/latest.json 2>/dev/null || true)
          if [ -z "$latest" ] || [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -1)" = "$version" ]; then
            cp dist/manifest.json ../channel/core/latest.json
          else
            echo "latest stays $latest"
          fi
          for f in install.sh install.ps1; do
            sed "s|https://raw.githubusercontent.com/neildmorris/herdr-core/channel|$HC_RELEASES_URL|g" "distribution/$f" > "../channel/core/$f"
            grep -qF "$HC_RELEASES_URL" "../channel/core/$f"
          done
          cd ../channel
          git add -A
          git commit -m "release $version"
          git push origin channel
